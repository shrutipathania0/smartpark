{% extends 'base.html' %}

{% block title %}SmartPark AI — Guard Authentication{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 3rem; margin-bottom: 0.5rem;">🛡️</div>
      <h2 style="font-size: 1.6rem; font-weight: 800;">Security Staff Login</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">SmartPark AI Facility Management Console</p>
    </div>

    <div id="login-alert-box" style="display: none;" class="alert-banner"></div>

    <form id="guard-login-form">
      <div class="form-group">
        <label class="form-label" for="login-username">GUARD USERNAME</label>
        <input type="text" id="login-username" class="form-control" placeholder="e.g. guard" required autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label class="form-label" for="login-password">SECURE PASSWORD</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1.05rem;">
        Authenticate & Enter &rarr;
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      Default Officer Account: <code>guard</code> / <code>smartpark2026</code>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("guard-login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("login-alert-box");
  const u = document.getElementById("login-username").value.trim();
  const p = document.getElementById("login-password").value.trim();
  const btn = document.getElementById("btn-login");

  btn.disabled = true;
  btn.textContent = "Verifying...";

  try {
    const res = await fetch("/api/guard/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = data.redirect || "/guard";
    } else {
      alertBox.style.display = "flex";
      alertBox.className = "alert-banner alert-danger";
      alertBox.textContent = data.error || "Authentication failed.";
      btn.disabled = false;
      btn.textContent = "Authenticate & Enter →";
    }
  } catch (err) {
    alertBox.style.display = "flex";
    alertBox.className = "alert-banner alert-danger";
    alertBox.textContent = "Server communication error.";
    btn.disabled = false;
    btn.textContent = "Authenticate & Enter →";
  }
});
</script>
{% endblock %}
